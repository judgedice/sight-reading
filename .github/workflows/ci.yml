name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Every copy key is used (tools/lint-copy.baseline.json lists the known debt, which may only shrink).
      - run: pnpm lint:copy
      # Negative fixtures must fail lint as intended.
      - run: pnpm lint:fixtures

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Generated artefacts must match their sources (01 section 14 items 6 and 15).
      - run: pnpm schemas:check
      - run: pnpm validators:check
      - run: pnpm tokens:check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # 01 section 13.3: pure packages bundled to one IIFE and run in a vm context with only ES2022 globals,
  # byte-identical to Node. P12 and P10b append grade and follow scenarios to tools/bare-runtime/scenarios.ts.
  bare-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:bare

  # 03 section 6.1: corpus pipeline unit tests. Tests that need the pinned source clones skip when the
  # cache is absent; the full fetch (`python -m corpus_build`) needs github.com and runs in its own job later.
  corpus-pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/corpus-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  # P18 synthetic accuracy gates (01 section 13.2) for the eight launch instruments. Exits 1 on a blocking gate failure.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm gates
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-report
          path: |
            docs/accuracy-report.md
            tools/gates/artifacts/accuracy.json

  # C10 corpus validation of public/corpus/v1 (render, fit, selector viability, stats, sources, dedupe).
  corpus-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm corpus:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0' }
      # In CI Playwright's own Chromium is used: clear the sandbox default path.
      # IOS_WEBKIT=1 adds the WebKit projects (e2e/webkit.ts); WebKit is installed above. Not run in the agent sandbox.
      - run: pnpm exec playwright test
        env: { PW_CHROMIUM_PATH: '', IOS_WEBKIT: '1' }
      # Suites with their own build, server or fake microphone (each config sets its marker env).
      - run: pnpm exec playwright test -c e2e/notation/playwright.notation.config.ts
        env: { PW_CHROMIUM_PATH: '', IOS_WEBKIT: '1' }
      - run: pnpm exec playwright test -c e2e/audio/playwright.audio.config.ts
        env: { PW_CHROMIUM_PATH: '' }
      - run: pnpm exec playwright test -c e2e/slice/playwright.slice.config.ts
        env: { PW_CHROMIUM_PATH: '' }
      - run: pnpm exec playwright test -c e2e/loop/playwright.loop.config.ts
        env: { PW_CHROMIUM_PATH: '', IOS_WEBKIT: '1' }
      - run: pnpm exec playwright test -c e2e/ios/playwright.ios.config.ts
        env: { PW_CHROMIUM_PATH: '', IOS_WEBKIT: '1' }
      - run: pnpm exec playwright test -c e2e/synthetic/playwright.synthetic.config.ts
        env: { PW_CHROMIUM_PATH: '', IOS_WEBKIT: '1' }
      - run: pnpm exec playwright test -c src/platform/web/sw/playwright.pwa.config.ts
        env: { PW_CHROMIUM_PATH: '', IOS_WEBKIT: '1' }
      - run: pnpm exec playwright test -c e2e/design/playwright.design.config.ts
        env: { PW_CHROMIUM_PATH: '' }
      - run: pnpm exec playwright test -c e2e/tour/playwright.tour.config.ts
        env: { PW_CHROMIUM_PATH: '' }

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, typecheck, unit, bare-runtime, corpus-pytest, gates, corpus-check, build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - uses: actions/deploy-pages@v4
