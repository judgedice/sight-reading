# Workspace root and the app crate. Audio crates will be added under crates/ (members glob below).
[workspace]
members = [".", "crates/*", "plugins/*"]
resolver = "2"

[package]
name = "sightread"
version = "0.1.0"
description = "Sightread: native shell around the sight-reading trainer web app."
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "sightread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sr-audio-core = { path = "crates/sr-audio-core" }
# `fake` is always on: SR_AUDIO_DEVICE=fake selects the silent test device in any build (the Linux smoke test needs it).
sr-audio-device = { path = "crates/sr-audio-device", features = ["fake"] }
# Session API types are compiled on every host so the mapping code in src/mobile.rs is tested on Linux; the plugin
# itself is registered only in mobile builds.
tauri-plugin-sr-audio-session = { path = "plugins/tauri-plugin-sr-audio-session" }

# Opens http(s) links in the system browser (a strict allow pattern in capabilities/default.json). All targets.
tauri-plugin-opener = "=2.7.3"

# Desktop only: the native save dialog behind `save_file` (rfd, the library Tauri's dialog plugin wraps; the plugin
# itself cannot be added here, it makes cargo downgrade tauri) and the display and idle sleep lock behind `keep_awake`.
# GTK 3 on Linux because the webview already runs on it; macOS and Windows use their system dialogs. Mobile has
# neither crate: the save command answers "not-available" there and keep-awake goes through the session plugin.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keepawake = "=0.6.1"
rfd = { version = "=0.18.0", default-features = false, features = ["gtk3"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
