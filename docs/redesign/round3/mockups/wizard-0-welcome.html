<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup: welcome</title>
<link rel="stylesheet" href="round3.css">
<script>if (/dark/.test(location.search)) document.documentElement.dataset.theme = 'dark';</script>
</head>
<body>
<header class="appbar"><div class="brand"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><g stroke="var(--text)" stroke-width="1.3" opacity="0.9"><path d="M1.5 4.5h21M1.5 8.25h21M1.5 12h21M1.5 15.75h21M1.5 19.5h21"/></g><ellipse cx="13" cy="10.1" rx="3.6" ry="2.6" transform="rotate(-22 13 10.1)" fill="var(--brass)"/></svg><span>Sightread</span></div></header>
<main class="wiz" style="max-width:640px;text-align:center;padding-top:56px">
  <div class="paper" style="padding:22px 28px;margin:0 auto 36px;max-width:560px"><svg class="score" viewBox="0 0 560 90" aria-hidden="true" font-family="Bravura">
<g stroke="var(--staff-line)" stroke-width="1.2"><path d="M8 20h544M8 32h544M8 44h544M8 56h544M8 68h544"/></g>
<text x="14" y="44" font-size="48" fill="var(--ink)"></text>

<text x="70" y="32" font-size="48" fill="var(--ink)"></text><text x="70" y="56" font-size="48" fill="var(--ink)"></text>
<g fill="var(--ink)" font-size="48"><text x="118" y="50"></text><text x="170" y="44"></text><text x="208" y="38"></text><text x="270" y="44"></text><text x="330" y="50"></text><text x="370" y="56"></text><text x="408" y="50"></text><text x="460" y="44"></text></g>

<rect x="250" y="20" width="1.6" height="48" fill="var(--ink)"/><rect x="440" y="20" width="1.6" height="48" fill="var(--ink)"/><rect x="546" y="20" width="5" height="48" fill="var(--ink)"/><rect x="540" y="20" width="1.6" height="48" fill="var(--ink)"/>
</svg></div>
  <h1 class="display" style="margin-bottom:16px">Read it. Play it. See how it went.</h1>
  <p class="muted" style="font-size:18px;margin-bottom:28px">Real music, a few bars at a time. We listen while you play and show you every note.</p>
  <button class="btn btn-primary btn-hero" style="min-width:280px">Get started</button>
  <p class="small muted" style="margin-top:20px">Three short steps: your instrument, a sound check, and you're ready.</p>
  <div class="card" style="margin:28px auto 0;padding:18px 22px 10px;max-width:560px;text-align:left"><ol class="wiz-steps" aria-label="Setup, step 0 of 3"><li class="wiz-step "><span class="bar"></span><span class="name"><span class="dot">1</span>Instrument</span></li><li class="wiz-step "><span class="bar"></span><span class="name"><span class="dot">2</span>Sound check</span></li><li class="wiz-step "><span class="bar"></span><span class="name"><span class="dot">3</span>Ready</span></li></ol></div>
  <p class="caption muted" style="margin-top:18px">Nothing is recorded or uploaded.</p>
</main></body>
</html>
