<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup sheet, opened from the Key chip</title>
<link rel="stylesheet" href="mockup.css">
<script>if (/dark/.test(location.search)) document.documentElement.dataset.theme = 'dark'; if (/hc/.test(location.search)) document.documentElement.dataset.contrast = 'high';</script>
</head>
<body class="viewport-only">
<meta name="sizes" content="phone"><style>
body { background: color-mix(in srgb, var(--bg) 70%, #000 30%); }
:root[data-theme="dark"] body { background: #050506; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 6px; }
.sheet .row { padding: 20px 0; }
.tempo-set { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
.sum-row { display:flex; align-items:center; gap:14px; width:100%; border:1px solid var(--border); background:var(--surface); padding:12px; border-radius:16px; }
</style><div class="scrim" style="background:transparent"></div><div class="sheet" style="margin-top:44px;min-height:calc(100vh - 44px)">
  <div class="grabber"></div>
  <div class="sheet-head"><h2 class="t-h2">Setup</h2><button class="btn btn-primary btn-compact">Done</button></div>
  <p class="t-caption muted" style="margin:0 16px 0">Scrolled to Key. Focus is on the chosen key.</p>
  <div style="padding:0 16px 40px">
    <div class="row" style="padding-top:14px"><div class="row-head"><p class="t-label">Key</p></div><div class="chip-grid" role="radiogroup" aria-label="Key" style="grid-template-columns:repeat(3,minmax(0,1fr))">
  <button class="chip chip-any " role="radio" aria-checked="false"><span class="name">Any key</span><span class="t-caption muted">Up to 1 sharp or flat</span><span class="tag">+8% XP</span></button>
  <p class="chip-group-label">Major</p>

ura" fill="currentColor" aria-hidden="true"><line x1="0" x2="420" y1="10.4" y2="10.4" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><line x1="0" x2="420" y1="16.9" y2="16.9" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><line x1="0" x2="420" y1="23.4" y2="23.4" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><line x1="0" x2="420" y1="29.9" y2="29.9" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><line x1="0" x2="420" y1="36.4" y2="36.4" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><text x="1.5" y="16.9" font-size="26" ></text><text x="27.3" y="29.9" font-size="26" ></text></svg></span><span class="name">F major</span></button>
  <p class="chip-group-label">Minor</p>
  <button class="chip  " role="radio" aria-checked="false"><span class="mk"><svg class="mini-key" viewBox="0 0 420 46.8" width="420" height="46.8" font-family="Bravura" fill="currentColor" aria-hidden="true"><line x1="0" x2="420" y1="10.4" y2="10.4" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><line x1="0" x2="420" y1="16.9" y2="16.9" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><line x1="0" x2="420" y1="23.4" y2="23.4" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><line x1="0" x2="420" y1="29.9" y2="29.9" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><line x1="0" x2="420" y1="36.4" y2="36.4" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><text x="1.5" y="16.9" font-size="26" ></text></svg></span><span class="name">A minor</span></button><button class="chip  " role="radio" aria-checked="false"><span class="mk"><svg class="mini-key" viewBox="0 0 420 46.8" width="420" height="46.8" font-family="Bravura" fill="currentColor" aria-hidden="true"><line x1="0" x2="420" y1="10.4" y2="10.4" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><line x1="0" x2="420" y1="16.9" y2="16.9" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><line x1="0" x2="420" y1="23.4" y2="23.4" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><line x1="0" x2="420" y1="29.9" y2="29.9" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><line x1="0" x2="420" y1="36.4" y2="36.4" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><text x="1.5" y="16.9" font-size="26" ></text><text x="27.3" y="16.9" font-size="26" ></text></svg></span><span class="name">E minor</span></button><button class="chip  " role="radio" aria-checked="false"><span class="mk"><svg class="mini-key" viewBox="0 0 420 46.8" width="420" height="46.8" font-family="Bravura" fill="currentColor" aria-hidden="true"><line x1="0" x2="420" y1="10.4" y2="10.4" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><line x1="0" x2="420" y1="16.9" y2="16.9" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><line x1="0" x2="420" y1="23.4" y2="23.4" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><line x1="0" x2="420" y1="29.9" y2="29.9" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><line x1="0" x2="420" y1="36.4" y2="36.4" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/><text x="1.5" y="16.9" font-size="26" ></text><text x="27.3" y="29.9" font-size="26" ></text></svg></span><span class="name">D minor</span></button>
</div>
<p class="note-line"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.25"/><path d="M12 16.5v-5"/><path d="M12 8h.01" stroke-width="2.4"/></svg><span>More keys from difficulty 3.</span></p></div>
    <div class="row"><div class="row-head"><p class="t-label">Time</p></div><div class="seg seg-time" role="radiogroup" aria-label="Time">
  <button class="seg-btn  " role="radio" aria-checked="false"><span>Any</span><span class="tag" style="margin-top:4px">+8% XP</span></button>
  <button class="seg-btn is-on " role="radio" aria-checked="true"><svg class="ts" viewBox="0 0 18 30" width="18" height="30" font-family="Bravura" fill="currentColor" aria-hidden="true"><text x="0" y="7.5" font-size="30" ></text><text x="0" y="22.5" font-size="30" ></text></svg></button>
  <button class="seg-btn  " role="radio" aria-checked="false"><svg class="ts" viewBox="0 0 18 30" width="18" height="30" font-family="Bravura" fill="currentColor" aria-hidden="true"><text x="0" y="7.5" font-size="30" ></text><text x="0" y="22.5" font-size="30" ></text></svg><span class="sub">few pieces</span></button>
</div>

<p class="note-line"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.25"/><path d="M12 16.5v-5"/><path d="M12 8h.01" stroke-width="2.4"/></svg><span>No 2/4 music for Baritone voice at difficulty 2 yet.</span></p></div>
    <div class="row">
      <div class="row-head"><p class="t-label">Tempo</p><span class="switch"><span class="switch-track"></span>Any tempo in range <span class="tag">+8% XP</span></span></div>
      <div class="tempo-set"><span class="t-h3 nb" style="min-width:72px"><span class="tempo num"><span class="qn" aria-hidden="true"></span>= 72<span class="sr">quarter note equals 72</span></span></span><div class="slider"><div class="trk"></div><div class="fill" style="width:50%"></div><div class="thumb" style="left:50%"></div></div><span class="field num" style="width:60px">72</span></div>
      <button class="btn btn-tonal btn-compact" style="margin-top:14px"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 4.5h6.8L19 20H5z"/><path d="M12 16.5 16.5 7.5"/><circle cx="12" cy="16.5" r="0.6" fill="currentColor"/><path d="M5 20h14"/></svg>Hear the tempo</button>
    </div>
  </div>
</div>
