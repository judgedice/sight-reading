# Quality and accompaniment filter thresholds (03 section 6.9, 6.10, 6.12). Values are the spec's starting
# points. Job C7 refits the fitted ones against the control sets and commits the result. C1 and C2 read none
# of this file except through the tests that check it parses and is complete.
version: 1
hard_rejects:
  rests:
    rest_ratio_max: 0.25
    max_rest_bars: 1            # any rest of this many bars or longer rejects
    leading_rest_max_beats: 1
  repetition:
    literal_bar_repeat_max_in_a_row: 2
    repeated_note_ratio_max: 0.35
    tempo_text_reject: '(?i)recit'
  pitch_variety_min_distinct_pcs:
    L1: 3
    L2: 4
    L3_plus: 5
  rhythm_variety:
    min_distinct_cells_from_level: 2
    min_distinct_cells: 2
  broken_chord:
    pattern_lengths: [2, 3, 4]
    interval_share_max: 0.5
  pedal_alternation_share_max: 0.25
  static_contour:
    contour_changes_per_note_min: 0.12
    step_share_exempt: 0.7
  sustained_harmony_share_max: 0.6
  quartet_melodic_role:
    applies_from_level: 3
    onset_coincidence_max: 0.7
  cello_bass_function:
    downbeat_lowest_share_min: 0.8
    fourth_fifth_interval_share_min: 0.4
    keep_up_to_level: 5
  fragments_min_notes_per_8_bars: 12
flags:
  leapy:
    leap_share_max: 0.25
    levels: [1, 2, 3, 4, 5, 6]
soft_score:
  keep_if_mean_at_least: 0.6
interest:
  weights:
    contour_changes_per_note: 0.3
    distinct_pcs_over_7: 0.3
    rhythm_cell_entropy: 0.2
    non_repeated_note: 0.2
  reject_below: 0.35
  reject_below_quartet_inner_and_cello_L1_L2: 0.25
  near_threshold_margin: 0.10   # items within this margin above the threshold require the agent veto
dedupe:
  ioi_ratio_quantisation: [0.25, 0.3333333333333333, 0.5, 0.6666666666666666, 1, 1.5, 2, 3, 4]
  ngram: 4
  near_duplicate_jaccard: 0.8
  near_duplicate_jaccard_same_work: 0.7
outliers:
  tail_percent: 2
  metrics:
    - notes_per_bar
    - peak_notes_per_second
    - rest_ratio
    - interest
    - span
    - syncopation_index
  reject_if_flagged_on_at_least: 2
  reject_level_confidence_1_above_level: 6
control_calibration:
  negative_rejection_min: 0.9
  positive_acceptance_min: 0.7
window_proposal:
  window_overlap_max: 0.5
  bars_min: 8
  bars_max: 12
